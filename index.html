<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f8f5"><meta name="description" content="记录不同年龄段喜欢的专辑，回顾曲风变化，生成可以分享的音乐履历。无需登录。">
<title>我的音乐履历</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F7F8F5'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2333C3B2' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23397F78'/%3E%3C/svg%3E">

<style>
:root{
  --bg:#0A0E14;
  --text:rgba(255,255,255,.94);
  --text-2:rgba(255,255,255,.62);
  --text-3:rgba(255,255,255,.38);
  --glass:rgba(255,255,255,.07);
  --glass-2:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.15);
  --accent:#FF6F5E;
  --teal:#33C3B2;
  --amber:#F2B444;
  --blue:#5B9CFF;
  --pink:#EC6AA0;
  --green:#7DC78A;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased;}
body{min-height:100vh;}
button{font-family:inherit;cursor:pointer;color:inherit;}
input{color:var(--text);}
input::placeholder{color:var(--text-3);}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;}
.view{display:none;position:relative;z-index:3;}.view.active{display:block;}
.wrap{max-width:480px;margin:0 auto;padding:0 18px 60px;}

/* ===== 背景：固定光斑 + 专辑封面虚化层 ===== */
.bg-aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(1100px 760px at 82% -8%,rgba(51,195,178,.16),transparent 62%),
    radial-gradient(960px 700px at -12% 28%,rgba(236,106,160,.14),transparent 60%),
    radial-gradient(1080px 780px at 58% 112%,rgba(91,156,255,.15),transparent 60%),
    radial-gradient(760px 600px at 108% 68%,rgba(242,180,68,.10),transparent 60%);}
.bg-aurora span{position:absolute;border-radius:50%;filter:blur(88px);opacity:.55;will-change:transform;
  animation:drift 28s ease-in-out infinite alternate;}
.bg-aurora span:nth-child(1){width:380px;height:380px;left:-90px;top:-60px;background:rgba(51,195,178,.28);}
.bg-aurora span:nth-child(2){width:320px;height:320px;right:-80px;top:22%;background:rgba(236,106,160,.24);animation-delay:-7s;animation-duration:34s;}
.bg-aurora span:nth-child(3){width:360px;height:360px;left:6%;bottom:-120px;background:rgba(91,156,255,.26);animation-delay:-14s;animation-duration:38s;}
.bg-aurora span:nth-child(4){width:260px;height:260px;right:10%;bottom:16%;background:rgba(242,180,68,.20);animation-delay:-21s;animation-duration:30s;}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1);}to{transform:translate3d(36px,42px,0) scale(1.12);}}
.bg-covers{position:fixed;inset:0;z-index:1;display:none;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);opacity:0;transition:opacity 1.2s ease;pointer-events:none;overflow:hidden;}
.bg-covers.on{display:grid;opacity:1;}
.bg-covers img{width:100%;height:100%;object-fit:cover;filter:blur(72px) saturate(1.5) brightness(.62);transform:scale(1.35);}
.bg-veil{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,14,20,.46) 0%,rgba(10,14,20,.60) 100%);}
@media (prefers-reduced-motion: reduce){.bg-aurora span{animation:none;}}

/* ===== 玻璃通用 ===== */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;
  backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  box-shadow:0 10px 34px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.12);}

/* ===== 首页 ===== */
#home{min-height:100vh;display:none;align-items:center;justify-content:center;padding:28px 22px;}
#home.active{display:flex;}
.home-card{width:100%;max-width:400px;padding:40px 30px 30px;text-align:center;}
.disc{width:128px;height:128px;border-radius:50%;position:relative;margin:0 auto 28px;animation:spin 18s linear infinite;
  background:conic-gradient(from 18deg,#2b3442,#10151c 30%,#3a4452 52%,#151b23 72%,#2b3442);
  box-shadow:0 12px 34px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.16),inset 0 3px 14px rgba(255,255,255,.16);}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle at center,transparent 0 6px,rgba(255,255,255,.045) 6px 7px);}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#4a5566,#1a212b);
  border:2px solid rgba(255,255,255,.25);
  box-shadow:inset 0 0 0 5px var(--accent),0 2px 8px rgba(0,0,0,.4);}
.disc-hole{position:absolute;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);border-radius:50%;background:#0A0E14;z-index:2;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){.disc{animation:none;}}
.home-title{font-size:34px;font-weight:900;letter-spacing:2px;line-height:1.15;}
.home-sub{margin-top:14px;color:var(--text-2);font-size:14px;line-height:1.9;}
.home-steps{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;justify:center;}
.home-steps{justify-content:center;}
.home-steps span{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;
  background:var(--glass);color:var(--text-2);}
.home-nick{margin-top:26px;}
.home-nick input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;
  background:rgba(255,255,255,.08);font-size:16px;font-family:inherit;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.home-nick input:focus{outline:none;border-color:rgba(255,111,94,.7);}
.btn-primary{margin-top:16px;width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,#FF7A6A,#FF9B66);
  box-shadow:0 10px 26px rgba(255,111,94,.32),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .15s,box-shadow .15s;}
.btn-primary:active{transform:scale(.98);}
.home-note{margin-top:20px;font-size:12px;color:var(--text-3);}

/* ===== 录入页 ===== */
.topbar{position:sticky;top:0;z-index:20;margin:0 -18px;padding:14px 18px 12px;
  background:rgba(10,14,20,.52);
  backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  border-bottom:1px solid var(--line);}
.topbar-title{font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;}
.topbar-title .mono{font-size:12px;color:var(--text-2);}
.stage-tabs{display:flex;gap:8px;margin-top:12px;}
.stage-tab{flex:1;border:1px solid var(--line);border-radius:12px;background:var(--glass);
  padding:9px 2px;text-align:center;font-size:12.5px;font-weight:500;line-height:1.5;
  color:var(--text-2);transition:all .2s;}
.stage-tab .num{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-3);}
.stage-tab{position:relative;}
.stage-tab .tab-cnt{position:absolute;top:-7px;right:-5px;min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--teal);color:#06231f;font-size:10.5px;font-weight:700;
  line-height:18px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.stage-tab.current{background:rgba(255,255,255,.92);border-color:transparent;color:#14181F;font-weight:700;}
.stage-tab.current .num{color:rgba(20,24,31,.5);}
.stage-tab.current .tab-cnt{background:#0d9488;color:#eafffc;}
.add-slot{min-height:48px !important;margin-top:12px;font-size:13.5px !important;}
.slot{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--glass);border:1px solid var(--line);border-radius:16px;margin-top:12px;padding:11px 12px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 6px 20px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.09);
  transition:transform .15s,border-color .15s;}
.slot:active{transform:scale(.99);}
.slot .idx{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-3);width:16px;flex-shrink:0;}
.slot-add{justify-content:center;font-weight:500;font-size:14.5px;color:var(--text-2);min-height:60px;
  border-style:dashed;background:rgba(255,255,255,.03);}
.slot-add .plus{color:var(--accent);font-size:20px;margin-right:8px;font-weight:700;}
.slot-cover{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--line);
  background:rgba(255,255,255,.06);flex-shrink:0;}
.slot-cover.ph{display:flex;align-items:center;justify-content:center;}
.slot-meta{flex:1;min-width:0;}
.slot-album{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-artist{font-size:12.5px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-badge{font-size:10.5px;border:1px solid var(--line);color:var(--text-2);border-radius:999px;padding:2px 9px;flex-shrink:0;
  background:rgba(255,255,255,.06);}
.slot-del{border:none;background:rgba(255,255,255,.1);border-radius:50%;width:26px;height:26px;
  font-size:15px;color:var(--text-2);flex-shrink:0;line-height:1;display:flex;align-items:center;justify-content:center;}
.entry-footer{display:flex;gap:12px;margin-top:24px;}
.btn-ghost{flex:1;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:15px;font-size:15px;font-weight:700;
  color:var(--text);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.btn-ghost.primary{border:none;color:#fff;background:linear-gradient(135deg,#FF7A6A,#FF9B66);
  box-shadow:0 10px 26px rgba(255,111,94,.30),inset 0 1px 0 rgba(255,255,255,.32);}
.entry-tip{margin-top:14px;font-size:12px;color:var(--text-3);text-align:center;line-height:1.8;}

/* ===== 搜索弹层 ===== */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.70);
  backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);
  display:none;flex-direction:column;}
.sheet.show{display:flex;}
.sheet-head{display:flex;gap:10px;align-items:center;padding:14px 18px 0;}
.sheet-head input{flex:1;border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:16px;font-family:inherit;
  background:rgba(255,255,255,.09);min-width:0;}
.sheet-head input:focus{outline:none;border-color:rgba(255,111,94,.7);}
.sheet-head button{background:none;border:none;font-size:15px;font-weight:500;padding:8px 4px;flex-shrink:0;color:var(--text-2);}
.search-mode{display:flex;gap:6px;margin:12px 18px 0;padding:4px;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.06);}
.search-mode button{flex:1;border:none;background:none;border-radius:9px;padding:9px 0;font-size:13.5px;font-weight:500;
  color:var(--text-2);}
.search-mode button.on{background:rgba(255,255,255,.92);color:#14181F;font-weight:700;}
.sheet-body{flex:1;overflow:auto;padding:4px 18px 40px;}
.sheet-hint{font-size:12px;color:var(--text-3);padding:12px 4px 8px;}
.res-row{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:none;
  padding:11px 4px;border-bottom:1px dashed rgba(255,255,255,.10);}
.res-row:active{opacity:.55;}
.res-row img{width:48px;height:48px;border-radius:9px;border:1px solid var(--line);object-fit:cover;flex-shrink:0;
  background:rgba(255,255,255,.06);}
.res-meta{flex:1;min-width:0;}
.res-album{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.res-sub{font-size:12px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.manual-btn{width:100%;margin-top:20px;border:1px dashed var(--line);background:rgba(255,255,255,.04);
  border-radius:14px;padding:14px;font-size:14px;color:var(--text-2);font-weight:500;}
.manual-box{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:15px;background:var(--glass);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:none;}
.manual-box.show{display:block;}
.manual-box .field{margin-bottom:10px;}
.manual-box input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit;
  background:rgba(255,255,255,.08);}
.manual-box input:focus{outline:none;border-color:rgba(255,111,94,.7);}
.manual-cover{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.manual-cover label{border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:13px;font-weight:500;
  background:rgba(255,255,255,.09);color:var(--text-2);}
.manual-cover input{display:none;}
.manual-cover img{width:48px;height:48px;border-radius:9px;object-fit:cover;border:1px solid var(--line);}
.manual-cover .mc-tip{font-size:12px;color:var(--text-3);}
.manual-save{width:100%;border:none;border-radius:11px;padding:14px;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(135deg,#FF7A6A,#FF9B66);
  box-shadow:0 8px 22px rgba(255,111,94,.28),inset 0 1px 0 rgba(255,255,255,.3);}

/* ===== 结果页 ===== */
#result{padding:20px 0 60px;}
#capture{position:relative;}
.capture-bg{position:absolute;inset:-16px -10px;border-radius:28px;z-index:0;
  background:linear-gradient(162deg,rgba(24,32,46,.90),rgba(10,14,20,.96));
  border:1px solid rgba(255,255,255,.06);}
#capture>*{position:relative;z-index:1;}
.hero{padding:20px 20px 22px;position:relative;overflow:hidden;}
.hero-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:3px;color:var(--text-3);}
.hero-meta .mono{font-size:10px;letter-spacing:1px;}
.hero-nick{margin-top:14px;font-size:14px;color:var(--text-2);}
.hero-tag{display:inline-block;margin-top:10px;font-size:11px;color:var(--teal);border:1px solid rgba(51,195,178,.4);
  background:rgba(51,195,178,.12);border-radius:999px;padding:3px 11px;letter-spacing:1px;}
.persona-name{font-size:32px;font-weight:900;line-height:1.25;margin-top:10px;
  background:linear-gradient(120deg,#fff 30%,#B8E8E2);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;}
.persona-desc{margin-top:10px;font-size:13.5px;line-height:1.85;color:var(--text-2);}
.hero-covers{display:flex;margin-top:18px;}
.hero-covers img{width:46px;height:46px;border-radius:10px;object-fit:cover;border:1.5px solid rgba(255,255,255,.35);
  margin-left:-8px;box-shadow:0 4px 12px rgba(0,0,0,.35);}
.hero-covers img:first-child{margin-left:0;}
.hero-covers .ph{width:46px;height:46px;border-radius:10px;margin-left:-8px;background:rgba(255,255,255,.07);
  border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;}
.hero-covers .ph:first-child{margin-left:0;}
.section-title{font-weight:700;font-size:14px;letter-spacing:2px;margin:26px 2px 12px;display:flex;align-items:center;gap:9px;
  color:var(--text);}
.section-title::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px rgba(255,111,94,.8);}
.score-card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:10px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:0 8px 26px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.10);}

/* ===== 音乐年龄主卡 ===== */
.age-card{background:linear-gradient(150deg,rgba(255,122,106,.20),rgba(51,195,178,.16) 60%,rgba(91,156,255,.18));
  border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:22px 22px 20px;margin-top:14px;
  backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  box-shadow:0 12px 34px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.14);}
.age-label{font-size:12px;letter-spacing:2px;color:var(--text-2);display:flex;justify-content:space-between;align-items:center;}
.age-label .mono{font-size:11px;color:var(--text-3);letter-spacing:0;}
.age-year{font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:700;line-height:1.1;margin-top:8px;
  background:linear-gradient(120deg,#FFC7BE,#B8E8E2);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;letter-spacing:1px;}
.age-year .unit{font-size:20px;font-family:'Noto Sans SC',sans-serif;font-weight:700;letter-spacing:2px;margin-left:6px;}
.age-row{display:flex;align-items:baseline;gap:12px;margin-top:2px;}
.age-song{font-size:13px;color:var(--text-2);font-weight:500;}
.age-comment{margin-top:10px;font-size:13.5px;line-height:1.8;color:var(--text);}
.age-detail{margin-top:8px;font-size:12px;line-height:1.7;color:var(--text-2);}
.age-empty{font-size:14px;color:var(--text-2);margin-top:14px;line-height:1.8;}

/* ===== 数据小纸条 ===== */
.notes-card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-top:10px;
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);}
.notes-title{font-size:12px;color:var(--text-3);letter-spacing:2px;margin-bottom:4px;}
.notes-card ul{list-style:none;}
.notes-card li{font-size:13px;line-height:1.7;color:var(--text-2);padding:7px 0 7px 18px;position:relative;
  border-bottom:1px dashed rgba(255,255,255,.08);}
.notes-card li:last-child{border-bottom:none;}
.notes-card li::before{content:"";position:absolute;left:2px;top:15px;width:5px;height:5px;border-radius:50%;background:var(--teal);}
.score-head{display:flex;justify-content:space-between;align-items:baseline;}
.score-name{font-weight:500;font-size:14px;color:var(--text-2);}
.score-num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;}
.score-num.c-red{color:var(--accent);}
.score-num.c-amber{color:var(--amber);}
.score-num.c-teal{color:var(--teal);}
.score-bar{height:8px;background:rgba(255,255,255,.10);border-radius:999px;margin-top:12px;overflow:hidden;}
.score-fill{height:100%;border-radius:999px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);background:var(--teal);}
.score-fill.red{background:linear-gradient(90deg,#FF8C70,#FF6F5E);box-shadow:0 0 12px rgba(255,111,94,.55);}
.score-fill.yellow{background:linear-gradient(90deg,#F6C65C,#F2B444);box-shadow:0 0 12px rgba(242,180,68,.5);}
.score-fill.teal{background:linear-gradient(90deg,#4ED7C6,#33C3B2);box-shadow:0 0 12px rgba(51,195,178,.5);}
.score-comment{margin-top:9px;font-size:12.5px;color:var(--text-2);line-height:1.6;}
.ingredient{margin-top:4px;}
.ing-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;}
.ing-name{width:74px;flex-shrink:0;font-weight:500;color:var(--text-2);}
.ing-bar{flex:1;height:9px;background:rgba(255,255,255,.10);border-radius:999px;overflow:hidden;}
.ing-fill{height:100%;background:var(--teal);border-radius:999px;}
.ing-fill.b2{background:var(--blue);}
.ing-fill.b3{background:var(--amber);}
.ing-fill.b4{background:var(--pink);}
.ing-fill.b5{background:var(--green);}
.ing-pct{width:40px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-2);flex-shrink:0;}
.lang-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.lang-tags span{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:12px;color:var(--text-2);}
.recognize-note{font-size:11.5px;color:var(--text-3);margin-top:12px;line-height:1.6;}
.wall-group{margin-top:16px;}

.wall{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.wall-cell{position:relative;padding-bottom:100%;border-radius:11px;overflow:hidden;
  background:rgba(255,255,255,.06);border:1px solid var(--line);}
.wall-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.wall-cell .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.result-actions{display:flex;gap:10px;margin-top:28px;}
.result-actions button{flex:1;padding:16px 6px;border-radius:14px;font-size:15px;font-weight:700;}
.btn-save{border:none;color:#fff;background:linear-gradient(135deg,#FF7A6A,#FF9B66);
  box-shadow:0 10px 26px rgba(255,111,94,.30),inset 0 1px 0 rgba(255,255,255,.32);}
.btn-restart{background:var(--glass);border:1px solid var(--line);color:var(--text);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.toast{position:fixed;left:50%;bottom:42px;transform:translateX(-50%);z-index:99;
  background:rgba(20,26,36,.82);border:1px solid var(--line);color:var(--text);
  padding:12px 22px;border-radius:999px;font-size:14px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center;}
.toast.show{opacity:1;}

    <div id="genreSource"></div>
    <div class="genre-save-bar"><button class="manual-save" id="genreSave" type="button">保存曲风</button><button class="manual-btn" id="genreReset" type="button">恢复原有资料</button></div>
  </div></div>

<script>
/* ==================== 配置 ==================== */
var STAGES=['13岁前','14-18岁','19-24岁','25岁后'];
var INIT_SLOTS=4;   /* 每个阶段初始空位 */
var MAX_SLOTS=8;   /* 每个阶段最多可选 */
var MIN_TOTAL=3;    /* 生成音乐履历至少需要的专辑数 */
var CURRENT_YEAR=new Date().getFullYear();
var SEARCH_CAP=100;
var PROXY_BASE='https://1507762860-iaq3p2ywov.ap-guangzhou.tencentscf.com';
function emptyAlbum(){return {artist:'',album:'',cover:null,year:null,genre:'',lang:'',source:''};}
function freshAlbums(){return STAGES.map(function(){var a=[];for(var i=0;i<INIT_SLOTS;i++)a.push(emptyAlbum());return a;});}
function filledInStage(si){return STATE.albums[si].filter(function(a){return a.artist&&a.album;}).length;}
var STATE={nick:'',stage:0,albums:freshAlbums()};
var TARGET={stage:0,idx:0};

function showView(id){
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1800);
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
/* 网易云封面在 p1/p2 两个图床间漂移，加载失败自动换另一个，仍失败再隐藏 */
function coverOnError(img){
  var s=img.src;
  if(s.indexOf('p1.music.126.net')>=0){img.onerror=null;img.src=s.replace('p1.music.126.net','p2.music.126.net');return;}
  if(s.indexOf('p2.music.126.net')>=0){img.onerror=null;img.src=s.replace('p2.music.126.net','p1.music.126.net');return;}
  img.onerror=null;img.style.visibility='hidden';
}

/* ==================== 背景封面虚化 ==================== */
function updateBg(){
  var covers=getAll().map(function(a){return a.cover;}).filter(Boolean);
  var n=Math.min(6,covers.length),picked=[];
  for(var i=0;i<n;i++){picked.push(covers[Math.floor(i*covers.length/n)]);}
  var el=document.getElementById('bgCovers');
  el.innerHTML=picked.map(function(u){return '<img src="'+u+'" onerror="coverOnError(this)">';}).join('');
  el.classList.toggle('on',picked.length>0);
}

/* ==================== 专辑搜索（网易云 + QQ + iTunes，全部走云函数） ==================== */
function fetchJson(url,timeout){
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort();},timeout);
  return fetch(url,{signal:ctrl.signal}).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);
    return r.json();
  }).then(function(j){clearTimeout(timer);return j;});
}
/* 云函数冷启动偶发 433，失败后补一次重试 */
function fetchJsonRetry(url,timeout){
  return fetchJson(url,timeout).catch(function(){
    return new Promise(function(res){setTimeout(function(){res(fetchJson(url,timeout));},700);});
  });
}

function normCNItem(x){
  var it={artist:x.artist||'',album:x.album||'',cover:x.cover||'',
          albumId:x.albumId||'',releaseDate:x.releaseDate||'',artists:x.artists||[],year:x.year?parseInt(x.year,10):null,source:x.source};
  it.genreName=x.genreName||'';it.genre='';it.lang='';
  if(it.source==='qq'&&it.cover)it.cover=PROXY_BASE+'/img?u='+encodeURIComponent(it.cover);
  return it;
}

function searchNorm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');}
function matchesSearch(item,q,mode){
  var k=searchNorm(q);if(!k)return false;
  if(mode==='album')return searchNorm(item.album)===k;
  var names=item.artists&&item.artists.length?item.artists:[item.artist];
  return names.some(function(name){return searchNorm(name)===k;});
}

function searchAlbums(q,mode){
  mode=mode||'artist';
  var u=encodeURIComponent(q);
  var cnOk=true;
  var ne=fetchJsonRetry(PROXY_BASE+'/search/netease?kw='+u+'&mode='+mode,10000).then(function(j){
    return (j&&j.ok?j.data:[]).map(normCNItem);
  }).catch(function(){cnOk=false;return [];});
  var qq=fetchJsonRetry(PROXY_BASE+'/search/qq?kw='+u+'&mode='+mode,10000).then(function(j){
    return (j&&j.ok?j.data:[]).map(normCNItem);
  }).catch(function(){cnOk=false;return [];});
  var it=fetchJsonRetry(PROXY_BASE+'/search/itunes?kw='+u+'&mode='+mode,10000).then(function(j){
    return (j&&j.ok?j.data:[]).map(function(x){
      var it={artist:x.artist||'',album:x.album||'',cover:x.cover||'',
              albumId:x.albumId||'',releaseDate:x.releaseDate||'',artists:x.artists||[],year:x.year?parseInt(x.year,10):null,source:'itunes',genreName:x.genreName||''};
      it.genre='';it.lang='';
      return it;
    });
  }).catch(function(){return [];});
  return Promise.all([ne,qq,it]).then(function(res){
    var neList=res[0],qqList=res[1],itList=res[2];
    var seen=new Set(),out=[];
    function push(it){
      if(!it.artist||!it.album||!matchesSearch(it,q,mode))return;
      // 保留 Live、重录、豪华版等版本信息，避免误合并不同作品。
      var key=searchNorm(it.artist)+'|'+searchNorm(it.album);
      if(seen.has(key))return;seen.add(key);out.push(it);
    }
    neList.forEach(push);qqList.forEach(push);itList.forEach(push);
    out.sort(function(a,b){
      return String(b.releaseDate||b.year||'').localeCompare(String(a.releaseDate||a.year||'')) || a.album.localeCompare(b.album);
    });
    return {list:out.slice(0,SEARCH_CAP),cnOk:cnOk};
  });
}

/* ==================== 首页 ==================== */
document.getElementById('startBtn').onclick=function(){
  STATE.nick=document.getElementById('nickInput').value.trim()||'无名氏';
  STATE.stage=0;renderEntry();showView('entry');
};

/* ==================== 录入页 ==================== */
function filledCount(){
  var n=0;
  STATE.albums.forEach(function(s){s.forEach(function(a){if(a.artist&&a.album)n++;});});
  return n;
}
function renderTabs(){
  var el=document.getElementById('stageTabs');el.innerHTML='';
  STAGES.forEach(function(s,i){
    var d=document.createElement('button');
    d.type='button';
    d.className='stage-tab'+(i===STATE.stage?' current':'');
    var cnt=filledInStage(i);
    d.innerHTML='<span class="num">0'+(i+1)+'</span>'+s+(cnt?'<span class="tab-cnt">'+cnt+'</span>':'');
    d.onclick=function(){STATE.stage=i;renderEntry();};
    el.appendChild(d);
  });
  document.getElementById('progressText').textContent='已选 '+filledCount()+' 张';
}
var NOTE_SVG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1.6"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>';
/* 删除后收掉末尾多余的空位，最少保留 INIT_SLOTS 个 */
function pruneStage(si){
  var list=STATE.albums[si];
  while(list.length>INIT_SLOTS && !list[list.length-1].artist){list.pop();}
}
function renderEntry(){
  renderTabs();
  var box=document.getElementById('albumForm');box.innerHTML='';
  var si=STATE.stage,list=STATE.albums[si];
  list.forEach(function(a,idx){
    var btn=document.createElement('button');
    btn.type='button';
    if(!a.artist){
      btn.className='slot slot-add';
      btn.innerHTML='<span class="idx">'+(idx+1)+'</span><span class="plus">+</span>添加专辑';
    }else{
      btn.className='slot';
      var cover=a.cover?'<img class="slot-cover" src="'+a.cover+'" onerror="coverOnError(this)">':'<span class="slot-cover ph">'+NOTE_SVG+'</span>';
      var badge=a.source==='manual'?'<span class="slot-badge">手动添加</span>':'';
      btn.innerHTML='<span class="idx">'+(idx+1)+'</span>'+cover+
        '<span class="slot-meta"><div class="slot-album">'+esc(a.album)+'</div><div class="slot-artist">'+esc(a.artist)+(a.year?' · '+a.year:'')+'</div></span>'+
        badge+'<span class="slot-del" data-del="'+idx+'">×</span>';
    }
    btn.onclick=function(e){
      if(e.target&&e.target.dataset&&e.target.dataset.del!==undefined){

/* v9: automatic metadata enrichment and a documented playful listening age. */
// Alternative is a broad platform category; it must not be silently renamed Rock.

GENRE_BY_ID.set('alternative',GENRES[GENRES.length-1]);
var familyLabelV8=familyLabel;
familyLabel=function(id){return id==='alternative'?'另类音乐':familyLabelV8(id);};
var AGE_ANCHOR=18.5; // midpoint of the 16–21-year formative-period assumption
function weightedMedian(points){
  var sorted=points.slice().sort(function(a,b){return a.year-b.year;}),sum=sorted.reduce(function(n,p){return n+p.weight;},0),part=0;
  for(var i=0;i<sorted.length;i++){part+=sorted[i].weight;if(part>=sum/2)return sorted[i].year;}
  return null;
}
function listeningAge(stages){
  var points=[];
  stages.forEach(function(s){var works=uniqueWorks(s.albums);works.forEach(function(a){var year=validYear(a);if(year!==null)points.push({year:year,weight:1/works.length,album:a});});});
  if(!points.length)return null;
  var median=weightedMedian(points),candidates=[];
  Array.from(new Set(points.map(function(p){return p.year;}))).forEach(function(start){
    var items=points.filter(function(p){return p.year>=start&&p.year<=start+4;});
    candidates.push({start:start,end:start+4,items:items,weight:items.reduce(function(n,p){return n+p.weight;},0),year:weightedMedian(items)});
  });
  candidates.sort(function(a,b){return b.weight-a.weight||Math.abs(a.year-median)-Math.abs(b.year-median)||a.year-b.year;});
  var best=candidates[0],sum=points.reduce(function(n,p){return n+p.weight;},0);
  return {value:Math.round(CURRENT_YEAR-best.year+AGE_ANCHOR),year:best.year,start:best.start,end:best.end,
    concentrated:best.weight/sum>=0.55,albums:uniqueWorks(best.items.map(function(p){return p.album;})).slice(0,3)};
}
var analyzeV8=analyze;
analyze=function(){var r=analyzeV8();r.musicAge=listeningAge(r.stages);r.stages.forEach(function(s){s.musicAge=listeningAge([s]);});return r;};
function musicAgeCards(r){
  if(!r.stages.length)return '';
  var overall=r.musicAge;
  var result='<div class="age-card"><div class="age-label">音乐年龄 <span>趣味估算</span></div>'+
    (overall?'<div class="age-year">'+overall.value+'<span class="unit">岁</span></div><p class="age-comment">'+(overall.concentrated?'所选唱片的年代重心：':'多个年代之间，本次取作参考的是：')+overall.year+' 年</p>':'<p class="age-comment">补充发行年份后，可以查看音乐年龄。</p>')+
    '<details class="age-method"><summary>怎么算的？</summary><p>这是根据所选唱片年代计算的趣味年龄，不是实际年龄或审美评分。借用 Spotify 公开的 16～21 岁假设，本版取其中点 18.5 岁，再按唱片年代折算到 '+CURRENT_YEAR+' 年并四舍五入。</p><p>先找权重最集中的五年发行区间，再取区间内的加权中位年份。整体统计中各阶段权重相同，阶段内不同作品平分权重；并列时优先接近全部记录的中位年份。没有使用同龄听众数据，也不是 Spotify 原算法复刻。</p><p>各阶段年龄都折算到今天，表示该阶段所选作品的年代偏好，不代表你当时的年龄。只有一张有年份的唱片时，结果就基于这一张；缺失年份不参与计算，曲库再版日期也可能影响结果。</p></details></div>';
  return result+'<div class="section-title">不同阶段的音乐年龄</div><div class="stage-ages">'+r.stages.map(function(s){return '<div class="score-card stage-age"><div class="stage-age-name">'+esc(s.name)+'</div><div class="stage-age-number">'+(s.musicAge?s.musicAge.value+'<small>岁</small>':'<small>年份待补充</small>')+'</div>'+(s.musicAge?'<div class="wall-by">唱片重心 · '+s.musicAge.year+'</div>':'')+'</div>';}).join('')+'</div>';
}

var AUTO_GENRES={},AUTO_STATE=new Map(),AUTO_QUEUE=[],AUTO_RUNNING=0,AUTO_SERVICE=null;

try{AUTO_GENRES=JSON.parse(localStorage.getItem(AUTO_STORAGE_KEY)||'{}');if(!AUTO_GENRES||typeof AUTO_GENRES!=='object'||Array.isArray(AUTO_GENRES))AUTO_GENRES={};}catch(e){}
function tagNorm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s\u2010-\u2015_\-]/g,'');}
function tagId(name){
  var k=tagNorm(name),special={'pop流行':'pop','rock摇滚':'rock','r&bsoul':'rnb','hiphoprap':'hiphop','rap':'hiphop','dnb':'drum-bass','electronica':'electronic','dance':'electronic'};

function automaticEvidence(data){
  var votes={},sources=[];
  (data.genres||[]).forEach(function(x){if(x.scope!=='album'||(x.sourceId==='lastfm'&&!(Number(x.count)>=10)))return;var id=tagId(x.name);if(!id)return;votes[id]=(votes[id]||0)+1;if(x.url&&/^https:\/\//.test(x.url))sources.push({title:x.source||'曲库资料',url:x.url});});

  var roots={pop:'pop',rock:'rock',electronic:'electronic',jazz:'jazz',folk:'folk',country:'folk',metal:'metal',hiphop:'hiphop'};

  var base=genreInfoV8(a);

function runAutoQueue(){

    (function(job){AUTO_RUNNING++;AUTO_STATE.set(job.key,'loading');
      autoService().then(function(available){
        if(!available){AUTO_STATE.set(job.key,'unavailable');return;}
        var query='artist='+encodeURIComponent(job.artist)+'&album='+encodeURIComponent(job.album)+'&source='+encodeURIComponent(job.source)+'&id='+encodeURIComponent(job.albumId);

/* Search one catalog at a time. Keep exact matching and edition-sensitive deduplication. */
var SEARCH_CACHE=new Map(),SEARCH_CACHE_TTL=5*60*1000,SEARCH_CACHE_CAP=60;
function searchAlbums(q,mode){
  mode=mode||'artist';
  var cacheKey=mode+'|'+searchNorm(q),cached=SEARCH_CACHE.get(cacheKey);
  if(cached&&Date.now()-cached.at<SEARCH_CACHE_TTL)return cached.promise;
  if(cached)SEARCH_CACHE.delete(cacheKey);
  var u=encodeURIComponent(q),cnOk=false;
  var sources=[
    {id:'netease',domestic:true,normalize:normCNItem},
    {id:'qq',domestic:true,normalize:normCNItem},
    {id:'itunes',domestic:false,normalize:function(x){
      return {artist:x.artist||'',album:x.album||'',cover:x.cover||'',
        albumId:x.albumId||'',releaseDate:x.releaseDate||'',artists:x.artists||[],
        year:x.year?parseInt(x.year,10):null,source:'itunes',genreName:x.genreName||'',genre:'',lang:''};
    }}
  ];
  function collect(raw,source){
    var seen=new Set(),out=[];
    (Array.isArray(raw)?raw:[]).forEach(function(x){
      var item=source.normalize(x);
      if(!item.artist||!item.album||!matchesSearch(item,q,mode))return;
      var key=searchNorm(item.artist)+'|'+searchNorm(item.album);
      if(seen.has(key))return;
      seen.add(key);out.push(item);
    });
    out.sort(function(a,b){return String(b.releaseDate||b.year||'').localeCompare(String(a.releaseDate||a.year||''))||a.album.localeCompare(b.album);});
    return out.slice(0,SEARCH_CAP);
  }
  function trySource(index){
    if(index>=sources.length)return Promise.resolve({list:[],cnOk:cnOk,source:null});
    var source=sources[index];
    return fetchJsonRetry(PROXY_BASE+'/search/'+source.id+'?kw='+u+'&mode='+mode+(source.id==='netease'&&mode==='artist'?'&paged=1':''),10000).then(function(j){
      if(!j||!j.ok||!Array.isArray(j.data))throw new Error('catalog unavailable');
      if(source.domestic)cnOk=true;
      var list=collect(j.data,source);
      return list.length?{list:list,cnOk:cnOk,source:source.id,page:j.page||null}:trySource(index+1);
    }).catch(function(){return trySource(index+1);});
  }
  var request=trySource(0).then(function(result){
    if(!result.list.length)SEARCH_CACHE.delete(cacheKey);
    return result;
  }).catch(function(error){SEARCH_CACHE.delete(cacheKey);throw error;});
  SEARCH_CACHE.set(cacheKey,{at:Date.now(),promise:request});
  if(SEARCH_CACHE.size>SEARCH_CACHE_CAP)SEARCH_CACHE.delete(SEARCH_CACHE.keys().next().value);
  return request;
}

function mergeCatalogPages(previous,incoming,q){
  var seen=new Set(),out=[];
  previous.concat(incoming).forEach(function(item){
    if(!matchesSearch(item,q,'artist'))return;
    var key=searchNorm(item.artist)+'|'+searchNorm(item.album);
    if(seen.has(key))return;seen.add(key);out.push(item);
  });
  return out.sort(function(a,b){return String(b.releaseDate||b.year||'').localeCompare(String(a.releaseDate||a.year||''))||a.album.localeCompare(b.album);});
}

function loadMoreArtistAlbums(res,q,mode){
  if(res.moreLoading||!res.page||!res.page.hasMore)return Promise.resolve();
  var offset=Number(res.page.nextOffset);
  if(!Number.isInteger(offset)||offset<1){res.moreError=true;return Promise.resolve();}
  res.moreLoading=true;res.moreError=false;
  function refresh(){if(catalogSearchIsActive(q,mode))renderSearchResponse(res,q,mode,searchSequence);}
  refresh();
  return fetchJsonRetry(PROXY_BASE+'/search/netease?kw='+encodeURIComponent(q)+'&mode=artist&paged=1&offset='+offset,10000).then(function(j){
    if(!j||!j.ok||!Array.isArray(j.data)||!j.page)throw new Error('page unavailable');
    if(j.page.hasMore&&!(Number(j.page.nextOffset)>offset))throw new Error('invalid next page');
    res.list=mergeCatalogPages(res.list,j.data.map(normCNItem),q);res.page=j.page;

</script><script>
/* Shared title fitting for the result page and Canvas export. */
function albumTitleLayout(text,width,baseSize,measure){
  text=String(text||'');var min=baseSize*.85,size=baseSize;
  if(measure(text,size)>width){
    if(measure(text,min)<=width){var low=min,high=baseSize;for(var i=0;i<16;i++){var mid=(low+high)/2;if(measure(text,mid)<=width)low=mid;else high=mid;}size=low;}
    else size=min;
  }
  var tokens=text.match(/[\x21-\x7E\u2019]+|\s+|[^\x21-\x7E\u2019\s]/gu)||[],lines=[],line='';
  tokens.forEach(function(token){
    if(!line&&/^\s+$/.test(token))return;
    if(line&&measure(line+token,size)>width){lines.push(line.trimEnd());line=token.trimStart();}else line+=token;
  });if(line.trim()||!lines.length)lines.push(line.trimEnd());
  return {size:size,lines:lines,lineHeight:baseSize*1.4};
}
function fitResultAlbumTitles(){
  var root=document.getElementById('resultWrap');if(!root||!root.querySelectorAll||typeof getComputedStyle!=='function')return;
  var canvas=document.createElement('canvas'),c=canvas.getContext('2d');if(!c)return;
  root.querySelectorAll('.social-albums').forEach(function(grid){
    var titles=Array.from(grid.querySelectorAll('.social-album strong'));
    titles.forEach(function(el){var style=getComputedStyle(el),base=parseFloat(style.getPropertyValue('--album-title-size'))||12,width=el.getBoundingClientRect().width;if(!width)return;
      var text=el.dataset.fullTitle||el.textContent;el.dataset.fullTitle=text;
      var layout=albumTitleLayout(text,width,base,function(t,size){c.font=style.fontWeight+' '+size+'px '+style.fontFamily;return c.measureText(t).width;});
      el.textContent=layout.lines.join('\n');el.style.fontSize=layout.size+'px';el.style.lineHeight=layout.lineHeight+'px';el.style.height='auto';el.dataset.titleHeight=layout.lines.length*layout.lineHeight;
    });
    for(var i=0;i<titles.length;i+=4){var row=titles.slice(i,i+4),height=Math.max.apply(null,row.map(function(el){return Number(el.dataset.titleHeight)||0;}));row.forEach(function(el){el.style.height=height+'px';});}
  });
}
var resultBeforeTitleFit=renderResult;
renderResult=function(){resultBeforeTitleFit.apply(this,arguments);scheduleTitleFit();};
var titleFitTimer;
function scheduleTitleFit(){clearTimeout(titleFitTimer);titleFitTimer=setTimeout(fitResultAlbumTitles,0);}
if(typeof window.addEventListener==='function')window.addEventListener('resize',scheduleTitleFit);
if(typeof ResizeObserver!=='undefined'){var titleRoot=document.getElementById('resultWrap');if(titleRoot)new ResizeObserver(scheduleTitleFit).observe(titleRoot);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(scheduleTitleFit);

/* Same stage order and four-album rows as the compact result page. */
socialPoster=async function(){

  var rowHeights=records.map(function(stage,si){var rows=[];for(var i=0;i<stage.length;i+=cols){var titleHeight=Math.max.apply(null,layouts[si].slice(i,i+cols).map(function(l){return l.lines.length*l.lineHeight;}));rows.push({titleHeight:titleHeight,height:cover+14+titleHeight+45});}return rows;});
  var stageHeights=indices.map(function(si){return 82+rowHeights[si].reduce(function(total,r){return total+r.height;},0)+26;});

    c.fillStyle='#397f78';c.font='21px sans-serif';socialWrap(c,socialGenres(si).join(' / ')||'曲风资料待补充',x,gy+72,width,27,2);

</script><script>
/* Name discovery is fuzzy; the selected artist's catalog stays exact. */
var ARTIST_SUGGEST_CACHE=new Map();
function clearArtistSuggestions(){var panel=document.getElementById('artistSuggestions');if(panel){panel.hidden=true;panel.innerHTML='';}}
function getArtistSuggestions(q){
  var key=searchNorm(q),cached=ARTIST_SUGGEST_CACHE.get(key);
  if(cached&&Date.now()-cached.at<300000)return cached.promise;
  var request=fetchJsonRetry(PROXY_BASE+'/artists?kw='+encodeURIComponent(q),6000).then(function(j){
    if(!j||!j.ok||!Array.isArray(j.data))throw new Error('artist suggestions unavailable');
    var seen=new Set();return j.data.filter(function(a){if(!a||typeof a.name!=='string'||!a.name.trim()||seen.has(searchNorm(a.name)))return false;seen.add(searchNorm(a.name));return true;}).slice(0,8);
  }).catch(function(e){ARTIST_SUGGEST_CACHE.delete(key);throw e;});
  ARTIST_SUGGEST_CACHE.set(key,{at:Date.now(),promise:request});
  if(ARTIST_SUGGEST_CACHE.size>60)ARTIST_SUGGEST_CACHE.delete(ARTIST_SUGGEST_CACHE.keys().next().value);
  return request;
}
function queryExactArtist(name,requestId){
  return searchAlbums(name,'artist').then(function(res){if(requestId===searchSequence)renderSearchResponse(res,name,'artist',requestId,true);}).catch(function(){if(requestId===searchSequence)searchHint.textContent='曲库暂时无法连接，可稍后重试或手动添加';});
}
function searchArtistQuery(q,requestId){
  return getArtistSuggestions(q).then(function(artists){
    if(requestId!==searchSequence)return;
    var exact=artists.some(function(a){return searchNorm(a.name)===searchNorm(q);});
    if(!artists.length||(exact&&artists.length===1))return queryExactArtist(q,requestId);
    var panel=document.getElementById('artistSuggestions');panel.hidden=false;
    panel.innerHTML='<p class="artist-suggest-heading">选择歌手，查看其专辑</p>'+artists.map(function(a){
      return '<button type="button" class="artist-option" data-artist-name="'+esc(a.name)+'"><strong>'+esc(a.name)+'</strong><span class="artist-option-arrow" aria-hidden="true">→</span></button>';
    }).join('');searchHint.textContent=artists.length+'位相关歌手';clearCatalogPager();
    // A short name can also be another artist's full name (Britney / Britney Spears).
    // Keep the choices available while showing only the exact artist's albums below.
    if(exact)return queryExactArtist(q,requestId);
  }).catch(function(){if(requestId===searchSequence)return queryExactArtist(q,requestId);});
}
document.getElementById('artistSuggestions').addEventListener('click',function(e){
  var button=e.target.closest('[data-artist-name]');if(!button)return;
  clearTimeout(searchTimer);var name=button.dataset.artistName,id=++searchSequence;
  searchInput.value=name;clearArtistSuggestions();searchResults.innerHTML='';clearCatalogPager();searchHint.textContent='搜索中…';
  queryExactArtist(name,id);
});

openSearch=function(){clearArtistSuggestions();openSearchBeforeSuggestions.apply(this,arguments);};
